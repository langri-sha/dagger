name: Probe

on:
  pull_request:

jobs:
  git-in-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Register the typescript module
        run: printf '\n[modules.typescript]\nsource = "typescript"\n' >> dagger.toml

      - name: typescript source
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v1.0.0-beta.27
          verb: call
          args: typescript source glob --pattern='.git/HEAD'

      - name: ci source
        run: dagger call ci source glob --pattern='.git/HEAD'
