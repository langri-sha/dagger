<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 640"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Dagger modular automation badge</title>
  <desc id="description">
    Three scuffed module cubes feed into a hand-inked, dagger-shaped automation
    pipeline on a dark workshop badge.
  </desc>

  <defs>
    <path
      id="badge"
      d="M178 49c55-6 99 1 145-3 53-4 95-1 138 6 25 4 46 20 58 42l61 106c12 20 8 44-3 67l-25 54 29 51c14 25 9 52-5 75l-63 108c-12 21-34 33-58 37-87 6-182-3-270 3-27 2-48-12-61-34L61 449c-13-23-10-49 3-71l29-56-33-57c-12-21-8-45 3-66L129 83c11-19 27-29 49-34Z"
    />
    <clipPath id="badge-clip">
      <use href="#badge" />
    </clipPath>
    <filter
      id="ink-wobble"
      x="-12%"
      y="-12%"
      width="124%"
      height="124%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".012 .065"
        numOctaves="3"
        seed="47"
        result="ink-noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="ink-noise"
        scale="5"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <filter
      id="soft-wobble"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".025 .11"
        numOctaves="2"
        seed="73"
        result="edge-noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="edge-noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>

  <use
    href="#badge"
    fill="#081225"
    stroke="#f4f0de"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#ink-wobble)"
  />
  <use
    href="#badge"
    fill="none"
    stroke="#4777ff"
    stroke-width="4"
    stroke-linecap="round"
    opacity=".6"
    transform="translate(3 -2)"
